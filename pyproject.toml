[project]
name = "habix-kakao-agent"
version = "0.1.0"
description = "Read-only KakaoTalk MCP and briefing collector with local room allowlists"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2.2,<3",
    "sqlcipher3>=0.6 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
kakao-agent = "kakao_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kakao_agent"]
include = ["src/kakao_agent/mac_identity_probe.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
